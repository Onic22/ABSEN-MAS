<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
  <title>Scan QR / Barcode - SILAK ABSEN</title>
  <script src="https://unpkg.com/html5-qrcode@2.3.8/html5-qrcode.min.js"></script>
  <style>
    *{box-sizing:border-box}body{margin:0;font-family:Arial,sans-serif;background:#111;color:#fff;min-height:100vh;display:flex;align-items:center;justify-content:center;padding:16px}.box{width:100%;max-width:520px;background:#fff;color:#111;border-radius:18px;overflow:hidden;box-shadow:0 20px 60px rgba(0,0,0,.35)}.head{background:linear-gradient(135deg,#3b82f6,#1d4ed8);color:#fff;padding:24px;text-align:center}.head h1{margin:0 0 6px;font-size:24px}.head p{margin:0;opacity:.9}.body{padding:20px}.status{text-align:center;padding:10px;border-radius:10px;background:#f1f5f9;color:#475569;font-size:14px;margin-bottom:14px}.status.ok{background:#dcfce7;color:#166534}.status.err{background:#fee2e2;color:#991b1b}#reader{width:100%;min-height:300px;background:#000;border-radius:14px;overflow:hidden}button{width:100%;margin-top:14px;padding:13px;border:0;border-radius:10px;background:#e2e8f0;font-size:15px;cursor:pointer}.hint{text-align:center;color:#64748b;font-size:12px;margin-top:12px;line-height:1.5}
  </style>
</head>
<body>
<div class="box">
  <div class="head"><h1>SILAK ABSEN</h1><p>Scan QR / Barcode</p></div>
  <div class="body">
    <div id="status" class="status">Meminta izin kamera...</div>
    <div id="reader"></div>
    <button onclick="location.href='about:blank'">Tutup</button>
    <div class="hint">Gunakan kamera belakang dan arahkan QR/barcode ke dalam kotak.</div>
  </div>
</div>
<script>
(function(){
  var params=new URLSearchParams(location.search);
  var token=params.get('token')||'';
  var status=document.getElementById('status');
  var scanner=null;
  var done=false;
  var formats=[];
  if(window.Html5QrcodeSupportedFormats){
    formats=[
      Html5QrcodeSupportedFormats.QR_CODE,
      Html5QrcodeSupportedFormats.CODE_128,
      Html5QrcodeSupportedFormats.CODE_39,
      Html5QrcodeSupportedFormats.CODE_93,
      Html5QrcodeSupportedFormats.EAN_13,
      Html5QrcodeSupportedFormats.EAN_8,
      Html5QrcodeSupportedFormats.UPC_A,
      Html5QrcodeSupportedFormats.UPC_E,
      Html5QrcodeSupportedFormats.ITF
    ];
  }
  function setStatus(t,cls){status.textContent=t;status.className='status '+(cls||'');}
  function send(code){
    if(done)return;
    done=true;
    setStatus('Kode terbaca: '+code,'ok');
    if(window.opener && !window.opener.closed){
      window.opener.postMessage({type:'SILAK_ABSEN_SCAN',code:String(code),token:token},'*');
      setTimeout(function(){window.close();},500);
    }else{
      var ret=params.get('return');
      if(ret){
        var sep=ret.indexOf('?')>=0?'&':'?';
        location.href=ret+sep+'scan='+encodeURIComponent(code);
      }
    }
  }
  function start(){
    try{
      scanner=new Html5Qrcode('reader');
      var cfg={fps:12,qrbox:{width:260,height:180},aspectRatio:1.777778};
      if(formats.length)cfg.formatsToSupport=formats;
      scanner.start({facingMode:{exact:'environment'}},cfg,function(decoded){send(decoded);},function(){}).then(function(){
        setStatus('Kamera aktif. Arahkan kode ke kotak.','ok');
      }).catch(function(err){
        // Fallback jika kamera belakang exact tidak tersedia.
        scanner.clear().then(function(){
          scanner=new Html5Qrcode('reader');
          scanner.start({facingMode:'environment'},cfg,function(decoded){send(decoded);},function(){}).then(function(){
            setStatus('Kamera aktif. Arahkan kode ke kotak.','ok');
          }).catch(function(e){
            setStatus('Kamera tidak dapat dibuka. Izinkan kamera di browser lalu muat ulang halaman. '+(e&&e.message?'('+e.message+')':''),'err');
          });
        });
      });
    }catch(e){setStatus('Scanner gagal dimuat: '+e.message,'err');}
  }
  window.addEventListener('beforeunload',function(){if(scanner){try{scanner.stop();}catch(e){}}});
  start();
})();
</script>
</body>
</html>
